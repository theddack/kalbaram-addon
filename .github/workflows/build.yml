# 프로그램 빌드. main 에 올리면 윈도우·맥을 빌드해서 Actions 아티팩트로 남기고,
# 버전 태그(v0.1.0 등)를 붙이면 GitHub 릴리스를 만들고 zip 두 개를 올린다.
# 릴리스 파일 이름은 영어 (GitHub 가 첨부 파일 이름의 한글을 지운다). zip 안의 폴더·프로그램 이름은 한글.
#   릴리스: https://github.com/theddack/kalbaram-addon/releases/latest
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# 빌드 작업은 읽기만 (릴리스 작업만 따로 쓰기 권한)
permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8  # 한글 파일 이름 출력 (윈도우 콘솔 기본 인코딩은 한글을 못 씀)

jobs:
  test:
    uses: ./.github/workflows/test.yml

  windows:
    needs: test  # 테스트가 통과해야 빌드
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: 도구 설치
        run: python -m pip install -r requirements-build.txt

      - name: 모듈 확인
        run: python -c "import desktop, build_data, champion_data, lol_calc, lcu, overlay, augocr, hudicons, gamelog, webview, tkinter, numpy, PIL, xxhash; import winrt.windows.media.ocr; print('ok')"

      - name: 빌드
        run: >
          pyinstaller --noconfirm --windowed --name 칼바람증강Addon
          --add-data "web;web" --add-data "rules.json;."
          --hidden-import build_data --hidden-import champion_data --hidden-import lol_calc
          --hidden-import lcu --hidden-import patch_check --hidden-import overlay --hidden-import augocr
          --collect-all winrt --hidden-import hudicons --hidden-import gamelog --hidden-import xxhash
          desktop.py

      - name: 결과 확인·압축
        shell: pwsh
        run: |
          $exe = "dist/칼바람증강Addon/칼바람증강Addon.exe"
          if (-not (Test-Path $exe)) { throw "exe 없음" }
          if (-not (Get-ChildItem dist/칼바람증강Addon -Recurse -Filter data.json)) { throw "data.json 이 번들에 없음" }
          Copy-Item 사용설명서.md dist/칼바람증강Addon/
          python tools/make_zip.py dist/칼바람증강Addon KalbaramAddon-Windows.zip
          "exe: {0:N1} MB / zip: {1:N1} MB" -f ((Get-Item $exe).Length / 1MB), ((Get-Item KalbaramAddon-Windows.zip).Length / 1MB)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows
          path: KalbaramAddon-Windows.zip
          retention-days: 30

  mac:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: 도구 설치
        run: python -m pip install -r requirements-build.txt

      # 실행 파일 이름은 영어로: 한글 실행 파일 이름이면 codesign 이 서명 도중 멈춰서(Bus error)
      # 서명이 깨진 앱이 되고, 받은 사람 맥에서 "손상되었기 때문에 열 수 없습니다"가 뜬다 (v0.1.3 까지)
      - name: 빌드
        run: >
          pyinstaller --noconfirm --windowed --name KalbaramAddon
          --osx-bundle-identifier io.github.theddack.aramaugment
          --add-data "web:web" --add-data "rules.json:."
          --hidden-import build_data --hidden-import champion_data --hidden-import lol_calc
          --hidden-import lcu --hidden-import patch_check --hidden-import overlay --hidden-import augocr --hidden-import hudicons --hidden-import gamelog --hidden-import xxhash --exclude-module PIL
          desktop.py

      - name: 이름·서명
        run: |
          APP=dist/칼바람증강Addon.app
          mv dist/KalbaramAddon.app "$APP"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 칼바람증강Addon" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 칼바람증강Addon" "$APP/Contents/Info.plist" \
            || /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 칼바람증강Addon" "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          if find "$APP" -name "*.cstemp" | grep -q .; then echo "서명 임시 파일이 남음"; exit 1; fi

      - name: 압축
        run: |
          test -d dist/칼바람증강Addon.app
          ditto -c -k --sequesterRsrc --keepParent dist/칼바람증강Addon.app KalbaramAddon-Mac.zip
          ls -la KalbaramAddon-Mac.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mac
          path: KalbaramAddon-Mac.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # 빌드 출처 증명(attestation) 서명용
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 버전 확인 (태그 = desktop.py APP_VERSION, 새 버전 알림이 맞게 뜨도록)
        env:
          TAG: ${{ github.ref_name }}  # 셸 명령에 바로 넣지 않고 환경 변수로
        run: |
          v=$(python3 -c "import re;print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('desktop.py', encoding='utf-8').read()).group(1))")
          test "v$v" = "$TAG" || { echo "태그 $TAG ≠ APP_VERSION $v"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: out
          merge-multiple: true
      # 배포 파일 변조 확인용: SHA-256 체크섬 + GitHub 빌드 출처 증명 (이 저장소의 이 워크플로가 만든 파일인지)
      - name: 체크섬
        run: |
          cd out && sha256sum KalbaramAddon-Windows.zip KalbaramAddon-Mac.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            out/KalbaramAddon-Windows.zip
            out/KalbaramAddon-Mac.zip
      - name: 릴리스 설명 (업데이트내역.md 의 그 버전 + 체크섬)
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/changelog.py release "$TAG" out/SHA256SUMS.txt > notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          name: 칼바람 증강 Addon ${{ github.ref_name }}
          body_path: notes.md
          files: |
            out/KalbaramAddon-Windows.zip
            out/KalbaramAddon-Mac.zip
            out/SHA256SUMS.txt
