# 매일 데이터 자동 갱신: 게임 데이터·위키·패치 노트를 새로 받아서 실제로 바뀌었을 때만 반영하고 사이트를 다시 배포한다.
# 하루 1번 (서버에 부담이 없는 빈도). 승률 통계 사이트는 수집하지 않는다.
name: refresh

on:
  schedule:
    - cron: "0 18 * * *"  # 매일 03:00 (한국 시간)
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: 데이터 도구 설치 (아이콘 WebP 변환)
        run: python -m pip install -r requirements-data.txt

      - name: 데이터 새로 받기
        run: |
          cp web/data.json /tmp/old.json
          python build_data.py --refresh
          # 챔피언·증강·아이템 수가 갑자기 크게 줄면(덜 받음) 반영하지 않는다
          python tools/data_sanity.py /tmp/old.json web/data.json
          python tools/changelog.py html

      # 새 데이터로 테스트: 데이터 형식이 바뀌어 화면이 깨지면 반영·배포하지 않는다
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: 새 데이터로 테스트
        run: |
          npm ci --no-audit --no-fund
          npm test
          python -m unittest discover -s tests

      # 증강 원본 대조: 저장된 대조 결과(docs/증강_원본_대조.json)에 없던 문제(불일치·설명 '?'·쿨다운 빠진 반복 효과·새 증강의
      # 계산 안 되는 수치)가 새 패치에서 생기면 '데이터 확인' 이슈에 덧붙인다 (안정화 기획서 4.2 패치별 재검증)
      - name: 증강 원본 대조
        run: |
          python tools/aug_resolve_check.py --json > /dev/null
          node tools/aug_audit.js --check > /tmp/aug_check.md || true
          if [ -s /tmp/aug_check.md ]; then
            ver=$(python -c "import json;print(json.load(open('web/data.json'))['version'])")
            [ -s web/review.md ] || printf '# 확인 필요 — 패치 %s\n' "$ver" > web/review.md
            printf '\n' >> web/review.md
            cat /tmp/aug_check.md >> web/review.md
            echo "증강 원본 대조: 새 문제 있음 → web/review.md"
          else
            echo "증강 원본 대조: 새 문제 없음"
          fi

      - name: 바뀌었는지 확인
        id: diff
        run: |
          if python tools/data_changed.py /tmp/old.json web/data.json; then echo "changed=1" >> "$GITHUB_OUTPUT"; fi

      - name: 저장소에 반영
        if: steps.diff.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web
          git commit -m "data: 자동 갱신 $(python -c "import json;d=json.load(open('web/data.json'));print(d['version'], d['builtAt'])")"
          git push

      # 새 증강·설명 변경·패치 노트 숫자 불일치·규칙 경고가 있으면 '데이터 확인' 이슈를 만들거나 내용을 바꾼다
      - name: 확인 필요 이슈
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s web/review.md ]; then echo "확인할 것 없음"; exit 0; fi
          gh label create "데이터 확인" --color c8aa6e --description "매일 갱신이 찾은 확인 필요 항목" --force
          title="$(head -1 web/review.md | sed 's/^# //')"
          # 같은 제목(같은 패치)의 이슈를 열린·닫힌 것 모두에서 찾는다
          num=$(gh issue list --label "데이터 확인" --state all --json number,title -q ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ -z "$num" ]; then
            gh issue create --title "$title" --label "데이터 확인" --body-file web/review.md
          elif [ "$(gh issue view "$num" --json body -q .body | tr -d '\r' | sed -e 's/[[:space:]]*$//')" = "$(sed -e 's/[[:space:]]*$//' web/review.md)" ]; then
            echo "#$num 와 내용이 같음 (이미 확인했거나 확인 중) → 그대로"
          else
            gh issue edit "$num" --body-file web/review.md
            gh issue reopen "$num" 2>/dev/null || true  # 닫았는데 새 항목이 생기면 다시 연다
            echo "#$num 내용이 바뀜 → 갱신"
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
        if: steps.diff.outputs.changed == '1'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: steps.diff.outputs.changed == '1'
        with:
          path: web
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
        if: steps.diff.outputs.changed == '1'
